name: Nemotron Real E2E

on:
  push:
    branches: [feat/nemotron-real-e2e]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  nemotron-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama
        shell: bash
        run: |
          if ! curl -fsS http://127.0.0.1:11434/api/tags >/dev/null 2>&1; then
            nohup env OLLAMA_HOST=127.0.0.1:11434 ollama serve > /tmp/ollama.log 2>&1 &
            echo $! > /tmp/ollama.pid
          fi

      - name: Wait for Ollama
        shell: bash
        run: |
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:11434/api/tags >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Ollama did not become ready on 127.0.0.1:11434"
          cat /tmp/ollama.log || true
          exit 1

      - name: Pull Nemotron 3 Nano 4B
        run: ollama pull nemotron-3-nano:4b

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build bundled runtime
        run: pnpm dlx esbuild apps/runtime/src/main.ts --bundle --platform=node --format=esm --outfile=apps/runtime/dist/main.js

      - name: Run real Nemotron agent smoke test
        env:
          IDLE_LLM_BASE_URL: http://127.0.0.1:11434/v1
          IDLE_LLM_MODEL: nemotron-3-nano:4b
          IDLE_LLM_TIMEOUT_MS: 300000
        run: node scripts/real-agent-local-smoke.mjs

      - name: Dump Ollama log on failure
        if: failure()
        run: cat /tmp/ollama.log || true
